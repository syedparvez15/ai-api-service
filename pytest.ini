[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    --tb=short
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=80
    -q

[coverage:run]
source = src
omit =
    src/__init__.py
    */migrations/*

[coverage:report]
show_missing = true
skip_covered = false
